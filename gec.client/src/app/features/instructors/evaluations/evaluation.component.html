<div *ngIf="loading" class="loading">
  <p>Loading...</p>
</div>

<div *ngIf="!loading">
  <app-course-summary [course]="evaluation?.course"></app-course-summary>
  <app-evaluation-status [courseState]="evaluation?.courseState"></app-evaluation-status>

  <bmb-tabs
    [format]="'uppercase'"
    [tabs]="tabs"
    (selected)="handleTabSelected($event)"
  ></bmb-tabs>

  <div class="container">
    <div class="sidebar">
      <!-- Contenido de la sección pequeña (izquierda) -->
        <app-student-list
          [students]="evaluation?.students || []"
          [courseState]="evaluation?.courseState"
          (studentSelected)="onStudentSelected($event)">
        </app-student-list>
    </div>
    <div class="content">
      <!-- Contenido de la sección grande (derecha) -->
        <app-student-detail
          *ngIf="evaluation?.selectedStudent"
          [student]="evaluation?.selectedStudent"
          [evaluationStructures]="evaluation?.evaluationStructures || []">
        </app-student-detail>
    </div>
  </div>
</div>
