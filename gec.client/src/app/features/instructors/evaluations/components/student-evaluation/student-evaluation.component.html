<h4 class="bmb_margin-s">
  Competencias:
  <section bmbButtonGroup class="bmb_border-radius-s" [appearance]="'secondary-outlined'" [size]="'large'">
    <button (click)="filterEvaluations('all')">Todos</button>
    <button (click)="filterEvaluations('evaluated')">Evaluados</button>
    <button (click)="filterEvaluations('pending')">Pendientes por evaluar
    </button>
  </section>
</h4>

<bmb-accordion
  *ngFor="let evaluationStructure of filteredEvaluations; let i = index; trackBy: trackByEvaluationId"
  [borderRadius]="'m'"
  [margin]="'s'"
  [paddingHeader]="'xs'"
  [paddingContent]="'m'"
  [hideToggle]="true"
  [active]="false"
  [expanded]="expandedStates[i]"
  [disabled]="false"
  (onClick)="onAccordionToggle(i)"
>
  <ng-container *ngIf="getEvaluationResult(evaluationStructure.id) as evalResult">
    <ng-template #bmbAccordionHeader class="bmb_card-header">
      <h3 bmbLayout alignItems="center" justify="spaceBetween" margin="none" class="bmb_padding-none">
        <div bmbLayout alignItems="center" justify="start" margin="s">
          <bmb-icon
            [icon]="'add_box'"
            [size]="30"
            bmbLayoutItem
          ></bmb-icon>
          <span bmbLayoutItem>{{ evaluationStructure.id }} - {{ evaluationStructure.name }}</span>
        </div>
        <div bmbLayout alignItems="center" justify="end" margin="s">
          <bmb-badge
            *ngIf="!evalResult.isEvaluated"
            [appearance]="'warning'"
            [text]="'Pendiente'"
            [container]="true"
            bmbLayoutItem
          >
          </bmb-badge>
          <bmb-badge
            *ngIf="evalResult.isEvaluated"
            [appearance]="'success'"
            [text]="'Completado'"
            [container]="true"
            bmbLayoutItem
          >
          </bmb-badge>
        </div>
      </h3>
    </ng-template>
    <ng-template #bmbAccordionContent>
      <div bmbLayout alignItems="center" justify="spaceBetween" margin="s">
        <h3 bmbLayoutItem>Rúbricas</h3>
        <bmb-checkbox
          bmbLayoutItem
          [id]="'checkbox1'"
          [checked]="evalResult.isEvaluated && evalResult.achievementLevel === 'NoElementosSuficientes'"
          [indeterminate]="false"
          [required]="false"
          [value]="''"
          [name]="''"
          [label]="'No hay elementos suficientes para evaluar'"
          [labelPosition]="'after'"
          [ariaDescribedby]="''"
          [ariaLabel]="''"
          [ariaLabelledby]="''"
        ></bmb-checkbox>
      </div>
      <div class="card-container">
        <bmb-list-group [borderRadius]="'none'" [margin]="'none'" [borderType]="'rounded'" [showControls]="true">
          <bmb-list-group-item
            *ngFor="let descriptor of evaluationStructure.descriptors" [id]="descriptor.level"
            [isActive]="evalResult.isEvaluated && evalResult.id === evaluationStructure.id && evalResult.achievementLevel === descriptor.level"
            (click)="handleCheckboxChange(evaluationStructure, descriptor)"
          >
            <div class="student-container">
              <div class="student-info">
                <bmb-badge
                  [appearance]="getBadgeAppearance(descriptor.level)"
                  [text]="descriptor.level"
                  [container]="true"
                ></bmb-badge>
                <p class="bmb_margin-s">{{ descriptor.description }}</p>
              </div>
            </div>
          </bmb-list-group-item>
        </bmb-list-group>
      </div>
      <div class="footer-container">
        <bmb-input
          [placeholder]="'Introduce tus comentarios aquí'"
          [isRequired]="true"
          [type]="'text'"
          [control]="getOrCreateControl(evalResult.id, evalResult.comments)"
          [maxlength]="500"
          [showMaxTextLength]="true"
          [label]="'Comentarios'"
          [labelPosition]="'after'"
          class="bmb_margin-s"
        ></bmb-input>
        <div class="button-row">
          <button
            *ngIf="!evalResult.isEvaluated"
            bmbButton
            appearance="secondary-outlined"
            size="small"
            position="left"
            [case]="false"
            [isToggleActive]="false"
            [enableButtonToggle]="false"
            [isRounded]="true"
            class="bmb_margin-s"
          >
            Cancelar
          </button>
          <button
            *ngIf="!evalResult.isEvaluated"
            bmbButton
            appearance="primary"
            icon="save"
            size="small"
            position="left"
            [case]="false"
            [isToggleActive]="false"
            [enableButtonToggle]="false"
            [isRounded]="true"
          >
            Guardar evaluación
          </button>
        </div>
      </div>
    </ng-template>
  </ng-container>
</bmb-accordion>
