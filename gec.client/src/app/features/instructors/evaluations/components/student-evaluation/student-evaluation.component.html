<bmb-accordion
  *ngFor="let evaluationStructure of evaluationStructures"
  [icon]="'keyboard_arrow_down'"
  [borderRadius]="'m'"
  [margin]="'m'"
  [paddingHeader]="'m'"
  [paddingContent]="'m'"
  [hideToggle]="false"
  [active]="false"
  [expanded]="true"
  [disabled]="false"
>
  <ng-template #bmbAccordionHeader>
    {{ evaluationStructure.id }} - {{ evaluationStructure.name }}
    <bmb-badge
      [appearance]="'warning'"
      [text]="'Pendiente'"
      [container]="true"
    ></bmb-badge>
  </ng-template>
  <ng-template #bmbAccordionContent>
    <bmb-checkbox
      [id]="'checkbox1'"
      [checked]="false"
      [disabled]="false"
      [indeterminate]="false"
      [required]="false"
      [value]="''"
      [name]="''"
      [label]="'No hay elementos suficientes para evaluar'"
      [labelPosition]="'after'"
      [ariaDescribedby]="''"
      [ariaLabel]="''"
      [ariaLabelledby]="''"
    ></bmb-checkbox>
    <bmb-card
      *ngFor="let descriptor of evaluationStructure.descriptors"
      [borderRadius]="'none'"
      [margin]="'s'"
      [type]="'normal'">
      <bmb-card-header padding="s">
        <bmb-icon [icon]="'menu'" [size]="20" [dotNotification]="0"></bmb-icon>
        {{ descriptor.level }}
      </bmb-card-header>
      <bmb-card-content padding="none">
      {{ descriptor.description }}
      </bmb-card-content>
    </bmb-card>
    <bmb-input
      [placeholder]="'Introduce tus comentarios aquí'"
      [disabled]="false"
      [isRequired]="false"
      [value]="''"
      [name]="''"
      [maxlength]="500"
      [showMaxTextLength]="true"
      [label]="'Comentarios'"
      [labelPosition]="'after'"
    ></bmb-input>
    <button
      bmbButton
      appearance="secondary-filled"
      icon="cancel"
      size="small"
      position="left"
      [case]="false"
      [isToggleActive]="false"
      [enableButtonToggle]="false"
      [isRounded]="true"
    >
      Cancelar
    </button>
    <button
      bmbButton
      appearance="primary"
      icon="save"
      size="small"
      position="left"
      [case]="false"
      [isToggleActive]="false"
      [enableButtonToggle]="false"
      [isRounded]="true"
    >
      Guardar evaluación
    </button>
  </ng-template>
</bmb-accordion>
