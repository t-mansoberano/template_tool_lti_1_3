<h4 class="bmb_margin-s">
  Competencias:
  <section bmbButtonGroup class="bmb_border-radius-s" [appearance]="'secondary-outlined'" [size]="'large'">
    <button (click)="filterEvaluations('all')" [class.active]="currentFilter === 'all'">Todos</button>
    <button (click)="filterEvaluations('evaluated')" [class.active]="currentFilter === 'evaluated'">Evaluados</button>
    <button (click)="filterEvaluations('pending')" [class.active]="currentFilter === 'pending'">Pendientes por evaluar
    </button>
  </section>
</h4>

<bmb-accordion
  *ngFor="let evaluationStructure of filteredEvaluations"
  [icon]="'keyboard_arrow_down'"
  [borderRadius]="'m'"
  [margin]="'s'"
  [paddingHeader]="'m'"
  [paddingContent]="'m'"
  [hideToggle]="false"
  [active]="false"
  [expanded]="expandedAccordion === evaluationStructure.id"
  [disabled]="false"
  (click)="toggleAccordion(evaluationStructure.id)"
>
  <ng-container *ngIf="getEvaluationResult(evaluationStructure.id) as evalResult">
    <ng-template #bmbAccordionHeader class="bmb_card-header">
      <h3>
        <bmb-badge
          *ngIf="!evalResult.isEvaluated"
          [appearance]="'warning'"
          [text]="'Pendiente'"
          [container]="true">
        </bmb-badge>
        <bmb-badge
          *ngIf="evalResult.isEvaluated"
          [appearance]="'success'"
          [text]="'Completado'"
          [container]="true">
        </bmb-badge>
        {{ evaluationStructure.id }} - {{ evaluationStructure.name }}
      </h3>
    </ng-template>
    <ng-template #bmbAccordionContent>
      <div class="display-flex-space-between">
        <h3>Rúbricas</h3>
        <bmb-checkbox
          [id]="'checkbox1'"
          [checked]="evalResult.isEvaluated && evalResult.achievementLevel === 'NoElementosSuficientes'"
          [disabled]="evalResult.isEvaluated"
          [indeterminate]="false"
          [required]="false"
          [value]="''"
          [name]="''"
          [label]="'No hay elementos suficientes para evaluar'"
          [labelPosition]="'after'"
          [ariaDescribedby]="''"
          [ariaLabel]="''"
          [ariaLabelledby]="''"
        ></bmb-checkbox>
      </div>
      <div class="card-container">
        <bmb-card
          class="bmb-card"
          *ngFor="let descriptor of evaluationStructure.descriptors"
          [borderRadius]="'none'"
          [margin]="'s'"
          [type]="evalResult.isEvaluated && evalResult.id === evaluationStructure.id && evalResult.achievementLevel === descriptor.level ? 'succes':'normal'">
          <bmb-card-header padding="s">
            <bmb-badge
              [appearance]="descriptor.level === 'Destacado'? 'success':descriptor.level === 'Sólido'? 'mitec_green':descriptor.level === 'Básico'? 'mitec_light_green':descriptor.level === 'Incipiente'? 'creative_licorice':'normal'"
              [text]="descriptor.level"
              [container]="true"
            ></bmb-badge>
            <bmb-radial
              [name]="evaluationStructure.id"
              [label]="' '"
              [checked]="evalResult.isEvaluated && evalResult.id === evaluationStructure.id && evalResult.achievementLevel === descriptor.level"
              [disabled]="evalResult.isEvaluated"
              (change)="handleCheckboxChange(evaluationStructure, descriptor)"
            ></bmb-radial>
          </bmb-card-header>
          <bmb-card-content>
            {{ descriptor.description }}
          </bmb-card-content>
        </bmb-card>
      </div>
      <div class="footer-container">
        <bmb-input
          [placeholder]="'Introduce tus comentarios aquí'"
          [isRequired]="true"
          [disabled]="evalResult.isEvaluated"
          [value]="evalResult.comments"
          [name]="'comments'"
          [maxlength]="500"
          [showMaxTextLength]="true"
          [label]="'Comentarios'"
          [labelPosition]="'after'"
          class="bmb_margin-s"
        ></bmb-input>
        <div class="button-row">
          <button
            *ngIf="!evalResult.isEvaluated"
            bmbButton
            appearance="secondary-outlined"
            size="small"
            position="left"
            [case]="false"
            [isToggleActive]="false"
            [enableButtonToggle]="false"
            [isRounded]="true"
            class="bmb_margin-s"
          >
            Cancelar
          </button>
          <button
            *ngIf="!evalResult.isEvaluated"
            bmbButton
            appearance="primary"
            icon="save"
            size="small"
            position="left"
            [case]="false"
            [isToggleActive]="false"
            [enableButtonToggle]="false"
            [isRounded]="true"
          >
            Guardar evaluación
          </button>
        </div>
      </div>
    </ng-template>
  </ng-container>
</bmb-accordion>
