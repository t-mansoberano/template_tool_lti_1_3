<bmb-card [borderRadius]="'none'" [margin]="'none'" [type]="'secondary'">
  <bmb-card-header padding="s">
    <h3>Alumnos evauados {{ courseState.evaluatedStudents }} / {{ courseState.totalStudents }}</h3>
  </bmb-card-header>
  <bmb-card-content padding="none">

    <bmb-tabs [tabs]="tabsData" (selected)="handleTabSelected($event)">
      <bmb-container *ngIf="activeTabId === 1" [appearance]="'primary-home'">
          <bmb-input
            class="bmb_margin-s"
            [placeholder]="'Filtrar por nombre o matrícula'">
          </bmb-input>
          <bmb-list-group [borderRadius]="'none'" [margin]="'m'">
            <bmb-list-group-item *ngFor="let student of students" id="{{student.id}}" (click)="selectStudent(student.id)">
              <div>
                <div>
                  <h3>{{ student.id }}</h3>
                  <span>{{ student.name }}</span>
                </div>
                <div>
                  <bmb-legend
                    [label]="String(student.pendingEvaluations) + '/' + String(student.totalEvaluations)"
                    [indicatorAppearance]="'info'"
                  ></bmb-legend>
                </div>
              </div>
            </bmb-list-group-item>
          </bmb-list-group>
      </bmb-container>
    </bmb-tabs>

  </bmb-card-content>
</bmb-card>
