<bmb-card [borderRadius]="'none'" [margin]="'none'" [type]="'secondary'">
  <bmb-card-header padding="s">
    <h3>Alumnos evauados {{ courseState.evaluatedStudents }} / {{ courseState.totalStudents }}</h3>
  </bmb-card-header>
  <bmb-card-content padding="none">

    <bmb-tabs [tabs]="tabsData" (selected)="handleTabSelected($event)">
      <bmb-container [appearance]="'primary-home'">
        <form [formGroup]="filterForm">
          <bmb-input
            class="bmb_margin-s"
            [placeholder]="'Filtrar por nombre o matrícula'"
            [control]="filterForm.controls['search']"
          >
          </bmb-input>
        </form>
        <bmb-list-group [borderRadius]="'none'" [margin]="'none'" [padding]="'xs'" [borderType]="'flush'">
          <bmb-list-group-item
            *ngFor="let student of filteredStudents(); trackBy: trackByStudentId" id="{{student.id}};"
            [isActive]="student.id === selectedStudentId"
            (click)="selectStudent(student)">
            <div bmbLayout alignItems="center" justify="spaceBetween">
              <div bmbLayoutItem>
                <h3>{{ student.loginId }}</h3>
                <span>{{ student.name }}</span>
              </div>
              <bmb-badge
                [appearance]="student.status === 'Completed' ? 'success' : 'info'"
                [text]="String(student.completedEvaluations) + '/' + String(student.totalEvaluations)"
                [container]="false">
              </bmb-badge>
            </div>
          </bmb-list-group-item>
        </bmb-list-group>
      </bmb-container>
    </bmb-tabs>

  </bmb-card-content>
</bmb-card>
