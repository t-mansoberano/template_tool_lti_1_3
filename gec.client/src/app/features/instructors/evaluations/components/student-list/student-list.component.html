<bmb-card [borderRadius]="'none'" [margin]="'none'" [type]="'secondary'">
  <bmb-card-header padding="s">
    <h3>Alumnos evauados {{ courseState.evaluatedStudents }} / {{ courseState.totalStudents }}</h3>
  </bmb-card-header>
  <bmb-card-content padding="none">

    <bmb-tabs [tabs]="tabsData" (selected)="handleTabSelected($event)">
      <bmb-container *ngIf="activeTabId === 1">
        <div class="tab-content">
          <bmb-input
            [placeholder]="'Filtrar por nombre o matrícula'">
          </bmb-input>
          <bmb-list-group [borderRadius]="'none'" [margin]="'none'">
            <bmb-list-group-item *ngFor="let student of students" id="{{student.id}}" (click)="selectStudent(student.id)">
              <div class="list-content">
                <div>
                  <h3>{{ student.id }}</h3>
                  <span>{{ student.name }}</span>
                </div>
                <div class="indicator">
                  <span *ngIf="student.status=='Evaluated'" class="circle" [style.backgroundColor]="'green'"></span>
                  <span *ngIf="student.status!=='Evaluated'" class="circle" [style.backgroundColor]="'purple'"></span>
                  <span class="evaluation-status">{{ student.pendingEvaluations }}/{{ student.totalEvaluations }}</span>
                </div>
              </div>
            </bmb-list-group-item>
          </bmb-list-group>
        </div>
      </bmb-container>
    </bmb-tabs>

  </bmb-card-content>
</bmb-card>
