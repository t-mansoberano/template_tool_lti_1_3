<h3 class="font-light-7">Retroalimentación</h3>

<bmb-card
  *ngFor="let evidence of evidences"
  [borderRadius]="'none'"
  [margin]="'s'"
  [type]="'normal'">
  <bmb-card-header padding="s">
    <bmb-text-link
      [textLink]="evidence.name"
      [textLinkStyle]="'icon'"
      [target]="'_blank'"
      [icon]="'open_in_new'"
      [iconPosition]="'left'"
      [link]="'https://www.youtube.com'"
      [disabled]="false"
    ></bmb-text-link>
    <span>| <span>Calificación: {{ evidence.grade }}</span></span>
  </bmb-card-header>
  <bmb-card-content padding="none">
    <p [ngStyle]="{padding: '1rem'}">
      {{ evidence.feedback }}
    </p>
  </bmb-card-content>
  <bmb-card-footer padding="xl">
    <button
      bmbButton
      appearance="secondary-filled"
      icon="mic"
      size="small"
      position="left"
    >
    </button>
    <button
      bmbButton
      appearance="secondary-filled"
      icon="video_call"
      size="small"
      position="left"
    >
    </button>
    <button
      bmbButton
      appearance="secondary-filled"
      icon="attach_file"
      size="small"
      position="left"
    >
    </button>
  </bmb-card-footer>
</bmb-card>
